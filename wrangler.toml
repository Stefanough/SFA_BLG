name = "stefanarmijo-blog"
compatibility_date = "2025-01-01"

# Static site generated by Middleman. `npm run build` (or the GitHub Action)
# produces ./build before `wrangler deploy` runs.
assets = { directory = "./build", not_found_handling = "404-page" }

# The stefanarmijo.com custom domain is attached to this Worker out-of-band
# (it only needs to be set up once). Keeping it out of this file means routine
# deploys only need Workers Scripts:Edit, not Zone > Workers Routes:Edit.
